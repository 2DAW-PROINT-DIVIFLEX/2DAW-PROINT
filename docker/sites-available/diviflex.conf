<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	ServerName www.diviflex.freeddns.org
	ServerAlias diviflex.freeddns.org
	DocumentRoot /var/www/html/public

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SSLEngine on

	SSLCertificateFile /etc/letsencrypt/live/diviflex.freeddns.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/diviflex.freeddns.org/privkey.pem

	<FilesMatch "\.(?:cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>
	<Directory /usr/lib/cgi-bin>
		SSLOptions +StdEnvVars
	</Directory>
	
	# SecRuleEngine On
	Header set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net;"
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</VirtualHost>

<VirtualHost *:80>
    ServerName www.diviflex.freeddns.org
    ServerAlias diviflex.freeddns.org
    Redirect permanent / https://diviflex.freeddns.org/
</VirtualHost>
